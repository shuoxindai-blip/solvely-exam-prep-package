<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="title desc">
  <title id="title">Parallel segments in triangle ABC</title>
  <desc id="desc">Points D and F divide side AB into lengths 8, 7, and 6. Point E lies on AC with AE equal to 16. Segments DE, FG, and BC are parallel.</desc>
  <rect width="680" height="390" fill="#fff"/>
  <g fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M105 48 206 335 610 288Z"/>
    <path d="M141 151 282 135"/>
    <path d="M170 236 443 203"/>
  </g>
  <g fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic">
    <text x="78" y="42">A</text><text x="198" y="373">B</text><text x="625" y="302">C</text>
    <text x="113" y="167">D</text><text x="286" y="129">E</text><text x="145" y="250">F</text><text x="448" y="197">G</text>
  </g>
  <g fill="#111827" font-family="Georgia, 'Times New Roman', serif" font-size="27">
    <text x="127" y="108">8</text><text x="146" y="207">7</text><text x="180" y="295">6</text><text x="183" y="83">16</text>
  </g>
</svg>
